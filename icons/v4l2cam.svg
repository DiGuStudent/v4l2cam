<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4553"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- 顶部凸起 -->
  <rect x="42" y="18" width="44" height="16" rx="6" fill="#111827"/>
  <!-- 机身 -->
  <rect x="12" y="28" width="104" height="74" rx="14" fill="url(#body)" stroke="#111827" stroke-width="2"/>
  <!-- 镜头外圈 -->
  <circle cx="64" cy="66" r="28" fill="#0f172a"/>
  <circle cx="64" cy="66" r="22" fill="url(#lens)"/>
  <!-- 镜头高光 -->
  <circle cx="57" cy="59" r="7" fill="#ffffff" opacity="0.4"/>
  <!-- 电源指示灯 -->
  <circle cx="26" cy="42" r="4" fill="#22c55e"/>
</svg>
